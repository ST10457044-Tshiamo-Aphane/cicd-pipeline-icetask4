name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:

  IMAGE_NAME: poe-app

jobs:
  # JOBS 1 and 2: checkout, set up .NET, build and test
  build-and-test:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore YOUR_SOLUTION.sln

      - name: Build
        run: dotnet build YOUR_SOLUTION.sln --no-restore --configuration Release

      # nit testsU
      - name: Run unit tests
        run: dotnet test YOUR_SOLUTION.sln --no-build --configuration Release

  # JOBS 3 and 4: package the image and push it to Docker Hub with a version tag
  docker-publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate using repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

  
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:v1.0.${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

  # JOB 5: SSH into the VPS and redeploy (GitHub Marketplace, 2026)
  deploy:
    needs: docker-publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/app
            docker-compose pull && docker-compose up -d

